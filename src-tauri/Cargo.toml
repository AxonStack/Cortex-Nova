[package]
name = "nova"
version = "0.1.21"
description = "Nova AI Voice Assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
enigo = { version = "0.2", features = ["x11rb"] }
